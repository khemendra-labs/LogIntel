[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logintel-engine"
version = "0.1.0"
description = "LogIntel Linux security telemetry and analysis engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "LogIntel Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
logintel-engine = "logintel.main:main"

[tool.setuptools.packages.find]
where = ["src"]
