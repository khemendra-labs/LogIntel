id: auth.password_spray
name: Password Spraying Pattern
description: Detects high-volume authentication failures originating from a single source IP across multiple accounts.
severity: CRITICAL
category: AUTH
rule_type: THRESHOLD
enabled: true

conditions:
  all:
    - field: event_type
      operator: equals
      value: AUTH_LOGIN_FAILURE
    - field: outcome
      operator: equals
      value: FAILURE
    - field: src_ip
      operator: exists
      value: true

threshold:
  count: 10
  window_seconds: 600

group_by:
  - src_ip

cooldown_seconds: 7200
