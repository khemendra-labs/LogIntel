id: sec.cron_persistence_tamper
name: Scheduled Task or Cron Persistence Modification
description: Detects creation or modification of scheduled tasks and crontabs in system cron directories or spool locations.
severity: WARNING
category: SECURITY
rule_type: ATOMIC
enabled: true

conditions:
  all:
    - field: event_type
      operator: in
      value:
        - FILE_PERSISTENCE_DROP
        - FILE_INTEGRITY_MODIFY
    - field: summary
      operator: regex
      value: '.*(cron|crontab).*'

cooldown_seconds: 1800
